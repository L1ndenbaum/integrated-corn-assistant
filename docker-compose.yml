version: "3.9"

services:
  static-server:
    image: ghcr.io/${IMAGE_PREFIX}-static-server:latest
    container_name: static-server
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      AVATAR_DIR: "/app/avatars"
    volumes:
      - avatars_data:/app/avatars
    restart: unless-stopped

  nginx:
    image: ghcr.io/${IMAGE_PREFIX}-nginx:latest
    container_name: corn-assistant-nginx
    ports:
      - "80:80"
    depends_on:
      - static-server
      - api-gateway
    restart: unless-stopped

  api-gateway:
    image: ghcr.io/${IMAGE_PREFIX}-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_SERVICE_BASE_URL: "http://auth-service:8082"
      USER_SERVICE_BASE_URL: "http://user-service:8081"
      CHAT_SERVICE_BASE_URL: "http://chat-service:8083"
      WEATHER_SERVICE_BASE_URL: "http://weather-service:8084"
      DIAGNOSIS_SERVICE_BASE_URL: "http://diagnosis-service:8085"
    depends_on:
      - user-service
      - auth-service
      - chat-service
    restart: unless-stopped

  chat-service:
    image: ghcr.io/${IMAGE_PREFIX}-chat-service:latest
    container_name: chat-service
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DIFY_API_KEY: "${DIFY_API_KEY}"
      DIFY_BASE_URL: "${DIFY_BASE_URL}"
      ALL_PROXY: "${ALL_PROXY}"
      PAGE_LIMIT: "20"
    restart: unless-stopped

  user-service:
    image: ghcr.io/${IMAGE_PREFIX}-user-service:latest
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      USER_DB_DSN: "corn-assistant-user:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/corn_assistant_user?parseTime=true"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "corn-assistant"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  auth-service:
    image: ghcr.io/${IMAGE_PREFIX}-auth-service:latest
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      AUTH_DB_DSN: "corn-assistant-auth:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/corn_assistant_auth?parseTime=true"
      USER_SERVICE_BASE_URL: "http://user-service:8081"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "corn-assistant"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
    depends_on:
      - user-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  avatars_data:
