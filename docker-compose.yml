version: "3.9"

services:
  static-server:
    image: ghcr.io/l1ndenbaum/integrated-corn-assistant-static-server:latest
    container_name: static-server
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      AVATAR_DIR: "/app/avatars"
    volumes:
      - avatars_data:/app/avatars
    restart: unless-stopped

  nginx:
    image: ghcr.io/l1ndenbaum/integrated-corn-assistant-nginx:latest
    container_name: corn-assistant-nginx
    ports:
      - "80:80"
    depends_on:
      - static-server
    restart: unless-stopped

  user-service:
    image: ghcr.io/l1ndenbaum/integrated-corn-assistant-user-service:latest
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      USER_DB_DSN: "corn-assistant-app:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/corn_assistant_user?parseTime=true"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "corn-assistant"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  auth-service:
    image: ghcr.io/l1ndenbaum/integrated-corn-assistant-auth-service:latest
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      AUTH_DB_DSN: "corn-assistant-auth:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/corn_assistant_auth?parseTime=true"
      USER_SERVICE_BASE_URL: "http://user-service:8081"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "corn-assistant"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
    depends_on:
      - user-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  avatars_data:
