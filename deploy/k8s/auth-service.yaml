apiVersion: apps/v1
kind: Deployment
metadata:
    name: auth-service
    labels:
        app: auth-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: auth-service
    template:
        metadata:
            labels:
                app: auth-service
        spec:
            containers:
                - name: auth-service
                  image: YOUR_DOCKERHUB_USER/corn-assistant-auth:latest
                  ports:
                      - containerPort: 8082
                  env:
                      - name: PORT
                        value: "8082"
                      - name: AUTH_DB_DSN
                        valueFrom:
                            secretKeyRef:
                                name: corn-assistant-secrets
                                key: auth_db_dsn
                      - name: USER_SERVICE_BASE_URL
                        value: "http://user-service:8081"
                      - name: JWT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: corn-assistant-secrets
                                key: jwt_secret
                      - name: JWT_ISSUER
                        value: "corn-assistant"
                      - name: ACCESS_TOKEN_TTL
                        value: "15m"
                      - name: REFRESH_TOKEN_TTL
                        value: "720h"
                      - name: COOKIE_SECURE
                        value: "false"
                      - name: COOKIE_SAMESITE
                        value: "lax"
---
apiVersion: v1
kind: Service
metadata:
    name: auth-service
    labels:
        app: auth-service
spec:
    selector:
        app: auth-service
    ports:
        - name: http
          port: 8082
          targetPort: 8082
