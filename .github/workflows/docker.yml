name: Build and Push Docker Image

on:
  push:
    branches: [ "refactor", "main"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image prefix
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build user-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/user-service/Dockerfile
          push: true
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=max,scope=user-service
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user-service:${{ github.sha }}

      - name: Build auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: true
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci

      - name: Build frontend static resources
        run: |
          cd client
          chmod +x ./build.sh
          ./build.sh

      - name: Build static-server
        uses: docker/build-push-action@v6
        with:
          context: ./static-server
          push: true
          cache-from: type=gha,scope=static-server
          cache-to: type=gha,mode=max,scope=static-server
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-static-server:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-static-server:${{ github.sha }}

      - name: Build chat-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/chat-service
          push: true
          cache-from: type=gha,scope=chat-service
          cache-to: type=gha,mode=max,scope=chat-service
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-chat-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-chat-service:${{ github.sha }}

      - name: Build weather-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/weather-service
          push: true
          cache-from: type=gha,scope=weather-service
          cache-to: type=gha,mode=max,scope=weather-service
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-weather-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-weather-service:${{ github.sha }}

      - name: Build diagnosis-service
        uses: docker/build-push-action@v6
        with:
          context: ./services/diagnosis-service
          push: true
          cache-from: type=gha,scope=diagnosis-service
          cache-to: type=gha,mode=max,scope=diagnosis-service
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-diagnosis-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-diagnosis-service:${{ github.sha }}

      - name: Build api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}

      - name: Build nginx
        uses: docker/build-push-action@v6
        with:
          context: ./infra/nginx
          push: true
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
