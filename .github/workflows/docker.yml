name: Build and Push Docker Image

on:
  push:
    branches: [ "refactor" ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user_service:
              - 'services/user-service/**'
              - 'common/**'
              - '.dockerignore'
            auth_service:
              - 'services/auth-service/**'
            chat_service:
              - 'services/chat-service/**'
            api_gateway:
              - 'api-gateway/**'
            static_server:
              - 'static-server/**'
            nginx:
              - 'infra/nginx/**'

      - name: Compute image prefix
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build user-service
        if: steps.changes.outputs.user_service == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/user-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-user-service:${{ github.sha }}

      - name: Build auth-service
        if: steps.changes.outputs.auth_service == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci

      - name: Build frontend static resources
        run: |
          cd client
          chmod +x ./build.sh
          ./build.sh

      - name: Build static-server
        if: steps.changes.outputs.static_server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./static-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-static-server:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-static-server:${{ github.sha }}

      - name: Build chat-service
        if: steps.changes.outputs.chat_service == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/chat-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-chat-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-chat-service:${{ github.sha }}

      - name: Build api-gateway
        if: steps.changes.outputs.api_gateway == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}

      - name: Build nginx
        if: steps.changes.outputs.nginx == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./infra/nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
